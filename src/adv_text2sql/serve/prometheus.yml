global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Инфра-метрики vLLM (throughput, токены, очередь запросов).
  - job_name: vllm
    static_configs:
      - targets: ['vllm:8000']
    metrics_path: /metrics

  # Продуктовые метрики качества из queries.jsonl (serve/metrics_exporter.py).
  - job_name: text2sql_quality
    static_configs:
      - targets: ['metrics-exporter:9105']
    metrics_path: /metrics
